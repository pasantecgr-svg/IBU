services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "3001:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:80"

  db:
    image: postgres:16
    restart: always
    ports:
      - "5434:5432"
    env_file:
      - ./backend/.env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # La base de datos no se expone al host; la app usa el servicio interno 'db'.

volumes:
  db_data:


